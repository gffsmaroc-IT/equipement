<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger King - IT Dashboard</title>
    <style>
        :root {
            --primary: #da291c;
            --secondary: #0033a0;
            --bg-color: #f4f4f5;
            --card-bg: #ffffff;
            --text-dark: #18181b;
            --border: #e4e4e7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 2rem;
        }

        .dashboard-wrapper {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header-section {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .header-section h1 {
            color: var(--secondary);
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        select {
            width: 100%;
            max-width: 500px;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: var(--secondary);
            color: white;
        }

        th {
            padding: 1rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        tbody tr:hover:not(.category-row) {
            background-color: #f8fafc;
        }

        .category-row {
            background-color: var(--primary) !important;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .category-row td {
            padding: 0.5rem 1rem;
        }

        .badge {
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            text-align: center;
        }

        .badge-yes { background-color: #dcfce7; color: #166534; }
        .badge-no { background-color: #fee2e2; color: #991b1b; }
        .badge-good { background-color: #dbeafe; color: #1e40af; }
        .badge-bad { background-color: #ffedd5; color: #9a3412; }
        .badge-empty { color: #a1a1aa; }

        .loader {
            display: none;
            text-align: center;
            padding: 4rem;
            font-size: 1.2rem;
            color: var(--secondary);
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 5rem 2rem;
            background: var(--card-bg);
            border-radius: 12px;
            color: #71717a;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <div class="header-section">
            <h1>Etat des Équipements IT - BK Maroc</h1>
            <div class="controls">
                <label for="restaurantSelect">Sélectionner un Restaurant :</label>
                <select id="restaurantSelect">
                    <option value="" disabled selected>-- Choisir parmi la liste --</option>
                </select>
            </div>
        </div>

        <div id="loader" class="loader">Synchronisation des données...</div>

        <div id="emptyState" class="empty-state">
            Veuillez sélectionner un restaurant pour afficher son matériel informatique.
        </div>

        <div class="table-container" id="tableContainer">
            <table>
                <thead>
                    <tr>
                        <th width="30%">Description</th>
                        <th width="10%">Existance</th>
                        <th width="15%">Marque</th>
                        <th width="15%">Modèle</th>
                        <th width="10%">Etat</th>
                        <th width="20%">Remarque</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SHEET_ID = '1FiYgCercDwkzpkLDTQe51y_S9NbcBP8Nd_vG26E8y5Q'; 
        
        const SHEET_NAMES = [
            'Etat équipement IT 2026 Techfin',
            'Etat équipement IT 2026 Temara',
            'Etat équipement IT 2026 Relais',
            'Etat équipement IT 2026 Agdal'
        ];

        const selectEl = document.getElementById('restaurantSelect');
        const loader = document.getElementById('loader');
        const tableContainer = document.getElementById('tableContainer');
        const tableBody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');

        SHEET_NAMES.forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.textContent = name.replace('Etat équipement IT 2026 ', 'BK '); 
            selectEl.appendChild(option);
        });

        selectEl.addEventListener('change', (e) => {
            fetchSheetData(e.target.value);
        });

        function fetchSheetData(sheetName) {
            emptyState.style.display = 'none';
            tableContainer.style.display = 'none';
            loader.style.display = 'block';
            tableBody.innerHTML = '';

            const oldScript = document.getElementById('gviz-script');
            if (oldScript) {
                oldScript.remove();
            }

            const script = document.createElement('script');
            script.id = 'gviz-script';
            script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:handleGoogleSheetsResponse&sheet=${encodeURIComponent(sheetName)}&range=A7:G`;
            
            script.onerror = function() {
                emptyState.innerHTML = `<span style="color:red">Erreur de connexion. Vérifiez votre internet.</span>`;
                emptyState.style.display = 'block';
                loader.style.display = 'none';
            };

            document.body.appendChild(script);
        }

        window.handleGoogleSheetsResponse = function(response) {
            if (response.status === 'error') {
                emptyState.innerHTML = `<span style="color:red">Erreur: ${response.errors[0].message}. Vérifiez le nom de la feuille.</span>`;
                emptyState.style.display = 'block';
                loader.style.display = 'none';
                return;
            }
            renderTable(response.table.rows);
        };

        function getBadgeHTML(value, type) {
            if (!value || value.toString().trim() === '') return `<span class="badge badge-empty">-</span>`;
            
            const valLower = value.toString().toLowerCase().trim();
            
            if (type === 'exist') {
                if (valLower === 'oui' || valLower === 'yes') return `<span class="badge badge-yes">${value}</span>`;
                if (valLower === 'non' || valLower === 'no') return `<span class="badge badge-no">${value}</span>`;
            }
            
            if (type === 'status') {
                if (valLower === 'bien' || valLower === 'good' || valLower === 'en marche') return `<span class="badge badge-good">${value}</span>`;
                if (valLower === 'mauvais' || valLower === 'bad' || valLower === 'panne' || valLower === 'moyenne') return `<span class="badge badge-bad">${value}</span>`;
            }
            
            return value; 
        }

        function renderTable(rows) {
            let bodyHtml = '';
            
            for (let i = 1; i < rows.length; i++) {
                const c = rows[i].c;
                if (!c) continue;

                const rawCategory = c[0] && c[0].v ? c[0].v.toString().trim() : '';
                const description = c[1] && c[1].v ? c[1].v.toString().trim() : '';
                
                if (!rawCategory && !description) continue;

                if (rawCategory) {
                    const cleanCategory = rawCategory.replace(':', '').trim();
                    bodyHtml += `
                        <tr class="category-row">
                            <td colspan="6">${cleanCategory}</td>
                        </tr>
                    `;
                }

                if (description) {
                    const exist = c[2] && c[2].v ? c[2].v : '';
                    const marque = c[3] && c[3].v ? c[3].v : '';
                    const modele = c[4] && c[4].v ? c[4].v : '';
                    const status = c[5] && c[5].v ? c[5].v : '';
                    const remarque = c[6] && c[6].v ? c[6].v : '';

                    bodyHtml += `
                        <tr>
                            <td><strong>${description}</strong></td>
                            <td>${getBadgeHTML(exist, 'exist')}</td>
                            <td>${marque || '<span class="badge-empty">-</span>'}</td>
                            <td>${modele || '<span class="badge-empty">-</span>'}</td>
                            <td>${getBadgeHTML(status, 'status')}</td>
                            <td><span style="color:#ef4444; font-size: 0.85rem;">${remarque || ''}</span></td>
                        </tr>
                    `;
                }
            }

            tableBody.innerHTML = bodyHtml;
            loader.style.display = 'none';
            tableContainer.style.display = 'table';
        }
    </script>
</body>
</html>
