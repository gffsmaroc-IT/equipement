<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord — État matériel IT 2026</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--color-background-tertiary, #f8f9fa);
      color: var(--color-text-primary, #212529);
    }
    .hdr {
      background: #c8372d;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hdr-logo {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -1px;
    }
    .hdr-sub {
      font-size: 12px;
      opacity: .7;
      margin-top: 2px;
    }
    .toolbar {
      background: #fff;
      border-bottom: .5px solid #dee2e6;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .toolbar label {
      font-size: 12px;
      color: #6c757d;
    }
    .toolbar select, .toolbar input {
      border: .5px solid #ced4da;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      background: #fff;
      color: #212529;
      outline: none;
    }
    .toolbar select {
      min-width: 240px;
    }
    .toolbar input {
      width: 180px;
    }
    .cnt-badge {
      font-size: 12px;
      background: #fff5f5;
      color: #c8372d;
      border-radius: 20px;
      padding: 3px 10px;
      font-weight: 500;
    }
    .stats-bar {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      flex-wrap: wrap;
    }
    .sc {
      background: #fff;
      border: .5px solid #dee2e6;
      border-radius: 8px;
      padding: 12px 16px;
      flex: 1;
      min-width: 110px;
    }
    .sc .v {
      font-size: 22px;
      font-weight: 500;
      line-height: 1;
    }
    .sc .l {
      font-size: 11px;
      color: #6c757d;
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .sc.g .v { color: #2b8a3e; }
    .sc.a .v { color: #e67e22; }
    .sc.r .v { color: #c8372d; }
    
    .content {
      padding: 0 20px 24px;
    }
    .tbl-wrap {
      background: #fff;
      border: .5px solid #dee2e6;
      border-radius: 8px;
      overflow: hidden;
    }
    .tbl-title {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 500;
      border-bottom: .5px solid #dee2e6;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
    }
    thead th {
      background: #f8f9fa;
      padding: 8px 12px;
      text-align: left;
      font-weight: 500;
      font-size: 11px;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: .4px;
      border-bottom: .5px solid #dee2e6;
    }
    tbody tr {
      border-bottom: .5px solid #dee2e6;
      cursor: pointer;
    }
    tbody tr:last-child {
      border-bottom: none;
    }
    tbody tr:hover {
      background: #f8f9fa;
    }
    tbody td {
      padding: 8px 12px;
      vertical-align: top;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rname {
      font-weight: 500;
      font-size: 13px;
    }
    .rnum {
      font-size: 11px;
      color: #6c757d;
    }
    .bk {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }
    .ok { background: #e6f4ea; color: #137333; }
    .wn { background: #fef7e0; color: #b06000; }
    .fl { background: #fce8e6; color: #c5221f; }
    .na { background: #f1f3f4; color: #5f6368; }
    
    .rest-hdr {
      background: #fff;
      border: .5px solid #dee2e6;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .rest-name {
      font-size: 18px;
      font-weight: 500;
    }
    .rest-num {
      font-size: 12px;
      color: #6c757d;
      margin-top: 2px;
    }
    .pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .sec-grid {
      display: grid;
      gap: 12px;
    }
    .sec {
      background: #fff;
      border: .5px solid #dee2e6;
      border-radius: 8px;
      overflow: hidden;
    }
    .sec-title {
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 500;
      color: #495057;
      text-transform: uppercase;
      letter-spacing: .5px;
      background: #f8f9fa;
      border-bottom: .5px solid #dee2e6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sec-title i {
      font-size: 16px;
    }
    .eq-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: .5px;
      background: #dee2e6;
    }
    .eq-item {
      background: #fff;
      padding: 12px 16px;
    }
    .eq-name {
      font-weight: 500;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .eq-meta {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .chip {
      font-size: 11px;
      background: #f1f3f4;
      border: .5px solid #dee2e6;
      border-radius: 4px;
      padding: 2px 6px;
      color: #5f6368;
    }
    .chip.br {
      background: #f8f9fa;
      color: #212529;
    }
    .rmk {
      margin-top: 6px;
      font-size: 11px;
      color: #b06000;
      background: #fef7e0;
      border-radius: 4px;
      padding: 4px 8px;
      border-left: 2px solid #e8a000;
    }
    .rmk.d {
      color: #c5221f;
      background: #fce8e6;
      border-left-color: #c8372d;
    }
    .nd {
      color: #868e96;
      font-style: italic;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #495057;
      background: #fff;
      border: .5px solid #ced4da;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .back-btn:hover {
      background: #f8f9fa;
    }
  </style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">BK</div>
  <div>
    <div style="font-size:14px;font-weight:500">Tableau de bord — État matériel IT 2026</div>
    <div class="hdr-sub">Burger King Morocco · Techfin</div>
  </div>
</div>

<div class="toolbar">

  </select>
  <label for="sb">Recherche</label>
  <input type="text" id="sb" placeholder="Nom, marque, équipement...">
  <span class="cnt-badge" id="cb">0 restaurant</span>
</div>

<div class="stats-bar" id="stbar"></div>
<div class="content" id="mc"></div>

n":"Tiroir 3","exists":"","brand":"","model":"","status":"","remark":""},{"description":"Tiroir 4","exists":"","brand":"","model":"","status":"","remark":""}]}];

const FAIL_W=['panne','hors service','infonctionnel','ne fonctionne','marche pas','dysfonction','cassé','casser','conneceur est cassé','endommagé','réparation','reparation','changement'];
const WARN_W=['parfois','bloqué','instable','besoin','organisation','lourd','rempli','plante'];

function classify(e){
  const s=(e.status+' '+e.remark).toLowerCase();
  const ex=(e.exists||'').trim().toLowerCase();
  if(!ex||ex===''||['non','no','n','0'].includes(ex)) return 'na';
  for(const w of FAIL_W) if(s.includes(w)) return 'fail';
  for(const w of WARN_W) if(s.includes(w)) return 'warn';
  if(!e.status && !e.remark && (ex==='oui'||ex==='o'||ex==='1')) return 'ok';
  return (['bien','ras','ok','bon','marche','fonctionnel','en marche','normal','opérationnel']).some(x=>s.includes(x)) ? 'ok' : 'ok';
}

function getCategory(desc){
  const d=desc.toLowerCase();
  if(d.startsWith('caisse')) return 'POS';
  if(d.startsWith('tiroir')) return 'HD';
  if(d.includes('godex')||d.includes('ptd')) return 'Imprimantes';
  if(d.includes('imprimante')) return 'Imprimantes';
  if(d.includes('kds')) return 'KDS';
  if(d.includes('dmb')) return 'DMB';
  if(d.includes('pc aloha')||d.includes('ecran')||d.includes('switch')||d.includes('routeur')||d.includes('anduleur')) return 'Bureau';
  return 'Bureau';
}

const CAT_ICONS={'Bureau':'ti-device-desktop','POS':'ti-cash-register','Imprimantes':'ti-printer','KDS':'ti-device-tablet','DMB':'ti-screen-share','HD':'ti-archive'};
const data=RAW.map(r=>({
  ...r,
  equip:r.equipment.filter(e=>e.description&&e.description.trim()).map(e=>({...e,cls:classify(e),cat:getCategory(e.description)}))
}));

const rs=document.getElementById('rs');
data.forEach((r,i)=>{
  const o=document.createElement('option');
  o.value=i;
  o.textContent=(r.number?`#${r.number} — `:'')+r.name;
  rs.appendChild(o);
});

function nd(val,fallback='Non déclaré'){return val&&val.trim()?val.trim():fallback;}

function badgeHtml(cls){
  const map={ok:['ok','Opérationnel'],warn:['wn','À surveiller'],fail:['fl','En panne'],na:['na','N/A']};
  const[c,l]=map[cls]||map.na;
  return `<span class="bk ${c}">${l}</span>`;
}

function eqItem(e){
  const brand=nd(e.brand);
  const model=nd(e.model);
  const status=nd(e.status, 'Non précisé');
  const isFR=e.cls==='fail';
  const rmk=e.remark&&e.remark.trim()&&e.remark.toLowerCase()!=='ras'?e.remark:'';
  return `<div class="eq-item">
    <div class="eq-name"><span>${e.description}</span>${badgeHtml(e.cls)}</div>
    <div class="eq-meta">
      <span class="chip br">${brand==='Non déclaré'?'<span class="nd">Marque non déclarée</span>':brand.toUpperCase()}</span>
      ${model!=='Non déclaré'?`<span class="chip">${model}</span>`:''}
      <span class="chip">${status}</span>
    </div>
    ${rmk?`<div class="rmk${isFR?' d':''}">${rmk}</div>`:''}
  </div>`;
}

function renderSingle(r){
  const cats={};
  r.equip.forEach(e=>{if(!cats[e.cat])cats[e.cat]=[];cats[e.cat].push(e);});
  const catOrder=['Bureau','POS','Imprimantes','KDS','DMB','HD'];
  
  let html=`<div class="back-btn" onclick="backToAll()"><i class="ti ti-arrow-left"></i> Retour à la liste</div>`;
  html+=`<div class="rest-hdr"><div><div class="rest-name">${r.name}</div>${r.number?`<div class="rest-num">N° ${r.number}</div>`:''}<div class="pills">`;
  const ok=r.equip.filter(e=>e.cls==='ok').length;
  const wn=r.equip.filter(e=>e.cls==='warn').length;
  const fl=r.equip.filter(e=>e.cls==='fail').length;
  if(ok) html+=`<span class="bk ok">${ok} OK</span>`;
  if(wn) html+=`<span class="bk wn">${wn} À surveiller</span>`;
  if(fl) html+=`<span class="bk fl">${fl} En panne</span>`;
  html+=`</div></div></div><div class="sec-grid">`;
  catOrder.forEach(cat=>{
    const items=cats[cat];
    if(!items||!items.length) return;
    html+=`<div class="sec"><div class="sec-title"><i class="ti ${CAT_ICONS[cat]||'ti-device-desktop'}"></i>${cat} (${items.length})</div><div class="eq-grid">${items.map(eqItem).join('')}</div></div>`;
  });
  html+='</div>';
  document.getElementById('mc').innerHTML=html;
}

function renderAll(list){
  if(!list.length){document.getElementById('mc').innerHTML='<div style="text-align:center;padding:40px;color:#6c757d">Aucun résultat.</div>';return;}
  let rows=list.map((r)=>{
    const fi=r.equip.filter(e=>e.cls==='fail');
    const wi=r.equip.filter(e=>e.cls==='warn');
    const oi=r.equip.filter(e=>e.cls==='ok');
    return `<tr onclick="openRest(${data.indexOf(r)})">
      <td><div class="rname">${r.name}</div>${r.number?`<div class="rnum">#${r.number}</div>`:''}</td>
      <td>${oi.length?`<span class="bk ok">${oi.length}</span>`:''}</td>
      <td>${wi.length?`<span class="bk wn">${wi.length}</span>`:'<span style="color:#adb5bd">—</span>'}</td>
      <td>${fi.length?fi.map(e=>`<div style="margin-bottom:2px"><span class="bk fl" style="font-size:10px; padding:1px 5px">${e.description}</span></div>`).join(''):'<span style="color:#adb5bd">—</span>'}</td>
    </tr>`;
  }).join('');
  document.getElementById('mc').innerHTML=`<div class="tbl-wrap">
    <div class="tbl-title">Vue globale — ${list.length} restaurant${list.length>1?'s':''} <span style="font-size:12px;color:#6c757d;font-weight:400">(cliquer sur une ligne pour inspecter)</span></div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th style="width:220px">Restaurant</th><th style="width:70px">OK</th><th style="width:100px">À surveiller</th><th>En panne</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`;
}

function renderStats(list){
  let tot=0,ok=0,wn=0,fl=0,sites=0;
  list.forEach(r=>{
    let activeFail=false;
    r.equip.forEach(e=>{
      if(e.cls==='na')return;
      tot++;
      if(e.cls==='ok')ok++;
      if(e.cls==='warn')wn++;
      if(e.cls==='fail'){fl++; activeFail=true;}
    });
    if(activeFail)sites++;
  });
  document.getElementById('stbar').innerHTML=`
    <div class="sc"><div class="v">${list.length}</div><div class="l">Restaurants</div></div>
    <div class="sc"><div class="v">${tot}</div><div class="l">Équipements</div></div>
    <div class="sc g"><div class="v">${ok}</div><div class="l">Opérationnels</div></div>
    <div class="sc a"><div class="v">${wn}</div><div class="l">À surveiller</div></div>
    <div class="sc r"><div class="v">${fl}</div><div class="l">En panne</div></div>
    <div class="sc r"><div class="v">${sites}</div><div class="l">Sites avec pannes</div></div>`;
}

function openRest(idx){
  rs.value=idx;
  render();
}

function backToAll(){
  rs.value='';
  render();
}

function render(){
  const sv=rs.value;
  const q=document.getElementById('sb').value.toLowerCase();
  let list=data;
  if(q) list=data.filter(r=>r.name.toLowerCase().includes(q) || r.number.includes(q) || r.equip.some(e=>e.description.toLowerCase().includes(q) || e.brand.toLowerCase().includes(q)));
  document.getElementById('cb').textContent=sv===''?`${list.length} restaurants`:'1 restaurant';
  renderStats(sv===''?list:[data[parseInt(sv)]]);
  if(sv!==''){renderSingle(data[parseInt(sv)]);}
  else{renderAll(list);}
}

rs.addEventListener('change',render);
document.getElementById('sb').addEventListener('input',render);
render();
</script>
