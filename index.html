<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Equipment Dashboard</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #d97706;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-dark: #111827;
            --text-light: #6b7280;
            --border: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 2rem;
        }

        .dashboard-wrapper {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header-section {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .header-section h1 {
            color: var(--primary);
            font-size: 1.8rem;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        select {
            flex: 1;
            max-width: 400px;
            padding: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #fff;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: var(--primary);
            color: white;
        }

        th {
            padding: 1.2rem 1rem;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            font-size: 0.95rem;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        .category-cell {
            font-weight: 700;
            color: var(--secondary);
            font-size: 1.1rem;
        }

        /* Status Badges */
        .badge {
            padding: 0.3rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            text-align: center;
        }

        .badge-yes { background-color: #dcfce7; color: #166534; }
        .badge-no { background-color: #fee2e2; color: #991b1b; }
        .badge-good { background-color: #dbeafe; color: #1e40af; }
        .badge-bad { background-color: #ffedd5; color: #9a3412; }
        .badge-empty { background-color: #f3f4f6; color: #6b7280; }

        .loader {
            display: none;
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            background: var(--card-bg);
            border-radius: 12px;
            color: var(--text-light);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <div class="header-section">
            <h1>IT Equipment Global Dashboard</h1>
            <div class="controls">
                <label for="restaurantSelect"><strong>Select Location:</strong></label>
                <select id="restaurantSelect">
                    <option value="" disabled selected>-- Select from the 40 Restaurants --</option>
                    </select>
            </div>
        </div>

        <div id="loader" class="loader">Fetching data securely from database...</div>

        <div id="emptyState" class="empty-state">
            Please select a restaurant location from the dropdown menu to view its IT inventory.
        </div>

        <div class="table-container" id="tableContainer">
            <table>
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Existance O/N</th>
                        <th>Marque</th>
                        <th>Modèle</th>
                        <th>Etat de mise en marche</th>
                        <th>Remarque</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const SHEET_ID = '1FiYgCercDwkzpkLDTQe51y_S9NbcBP8Nd_vG26E8y5Q'; 
        
        // You must manually add all 40 exact sheet names here. Client-side JS cannot auto-fetch tab names from Google Sheets.
        const SHEET_NAMES = [
            'Etat équipement IT 2026 Techfin',
            'Etat équipement IT 2026 Temara',
            'Etat équipement IT 2026 Relais',
            'Etat équipement IT 2026 Agdal',
            // Add the remaining 36 sheet names here exactly as they are typed in Excel:
            // 'Etat équipement IT 2026 Maarif',
            // 'Etat équipement IT 2026 Marina',
        ];

        const selectEl = document.getElementById('restaurantSelect');
        const loader = document.getElementById('loader');
        const tableContainer = document.getElementById('tableContainer');
        const tableBody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');

        SHEET_NAMES.forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.textContent = name.replace('Etat équipement IT 2026 ', ''); 
            selectEl.appendChild(option);
        });

        selectEl.addEventListener('change', (e) => {
            fetchSheetData(e.target.value);
        });

        async function fetchSheetData(sheetName) {
            emptyState.style.display = 'none';
            tableContainer.style.display = 'none';
            loader.style.display = 'block';
            tableBody.innerHTML = '';

            // The &range=A7:G is critical. It skips the messy title rows (1-6) and only fetches the actual table data.
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&range=A7:G`;

            try {
                const response = await fetch(url);
                const text = await response.text();
                const jsonString = text.match(/(?<=.*\().*(?=\);)/s)[0];
                const data = JSON.parse(jsonString);
                
                renderTable(data.table.rows);
            } catch (error) {
                console.error('Data fetch error:', error);
                emptyState.innerHTML = `<span style="color:red">Failed to load data. Please check connection and Sheet ID.</span>`;
                emptyState.style.display = 'block';
                loader.style.display = 'none';
            }
        }

        function getBadgeHTML(value, type) {
            if (!value || value.trim() === '') return `<span class="badge badge-empty">-</span>`;
            
            const valLower = value.toString().toLowerCase().trim();
            
            if (type === 'exist') {
                if (valLower === 'oui' || valLower === 'yes') return `<span class="badge badge-yes">${value}</span>`;
                if (valLower === 'non' || valLower === 'no') return `<span class="badge badge-no">${value}</span>`;
            }
            
            if (type === 'status') {
                if (valLower === 'bien' || valLower === 'good') return `<span class="badge badge-good">${value}</span>`;
                if (valLower === 'mauvais' || valLower === 'bad' || valLower === 'panne') return `<span class="badge badge-bad">${value}</span>`;
            }
            
            return value; 
        }

        function renderTable(rows) {
            let bodyHtml = '';

            rows.forEach(row => {
                const c = row.c;
                if (!c) return;

                const category = c[0] && c[0].v ? c[0].v : '';
                const description = c[1] && c[1].v ? c[1].v : '';
                
                // Skip completely empty rows in the table
                if (!category && !description) return;

                const exist = c[2] && c[2].v ? c[2].v : '';
                const marque = c[3] && c[3].v ? c[3].v : '';
                const modele = c[4] && c[4].v ? c[4].v : '';
                const status = c[5] && c[5].v ? c[5].v : '';
                const remarque = c[6] && c[6].v ? c[6].v : '';

                bodyHtml += `
                    <tr>
                        <td class="category-cell">${category}</td>
                        <td><strong>${description}</strong></td>
                        <td>${getBadgeHTML(exist, 'exist')}</td>
                        <td>${marque || '-'}</td>
                        <td>${modele || '-'}</td>
                        <td>${getBadgeHTML(status, 'status')}</td>
                        <td>${remarque || '-'}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = bodyHtml;
            loader.style.display = 'none';
            tableContainer.style.display = 'block';
        }
    </script>
</body>
</html>
